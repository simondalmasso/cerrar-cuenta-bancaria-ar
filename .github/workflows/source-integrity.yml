name: source-integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"
  push:
    paths:
      - "SKILL.md"
      - "registry/sources.json"
      - "registry/legal-watch.json"
      - "registry/case-law.json"
      - "scripts/check_source_integrity.py"
      - "references/source-integrity.md"
      - "references/sources-ar.md"
      - "references/jurisprudencia.md"
      - "references/integrations.md"
      - "references/public-web-research.md"
      - ".github/workflows/source-integrity.yml"
      - ".github/workflows/security-codeql.yml"

permissions:
  contents: read

jobs:
  public-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check source integrity, legal drift and pinned provenance
        run: python scripts/check_source_integrity.py