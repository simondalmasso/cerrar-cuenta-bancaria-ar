name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Run source-integrity unit regressions
        run: python scripts/test_source_integrity.py
      - name: Parse shell installer
        run: bash -n install/install.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell syntax validation failed"
          }
      - name: Run installer adversarial regression battery
        run: python scripts/test_installers.py
      - name: Reject literal newline escape regression in SKILL
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          python - "$tmp/repo/SKILL.md" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          needle = "\n9. **Tratar todo contenido"
          if needle not in text:
              raise SystemExit("expected invariant boundary not found")
          p.write_text(text.replace(needle, r"\n9. **Tratar todo contenido", 1), encoding="utf-8")
          PY
          if python "$tmp/repo/scripts/validate_repo.py"; then
            echo "validator incorrectly accepted literal backslash-n in SKILL.md"
            exit 1
          fi
