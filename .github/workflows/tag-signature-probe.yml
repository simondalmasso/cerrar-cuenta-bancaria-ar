name: tag-signature-probe

on:
  push:
    branches:
      - "ops/tag-signature-probe"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create unreachable annotated tag object without custom tagger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: 9bc3e0d6302dd4ee2ee6a0eb43755f0bba584c96
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"
          payload="$(jq -n             --arg tag "v1.2.0"             --arg message "signature probe for frozen v1.2.0"             --arg object "${TARGET_SHA}"             '{tag:$tag,message:$message,object:$object,type:"commit"}')"
          result="$(curl -fsS -X POST             -H "${auth}" -H "${accept}" -H "${version}"             "${api}/git/tags" -d "${payload}")"
          echo "${result}" | jq '{sha,tag,tagger,verification}'
